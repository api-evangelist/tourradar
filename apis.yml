aid: tourradar
name: TourRadar
description: TourRadar is the world's largest online marketplace for multi-day organized
  adventures, connecting travelers with more than 50,000 tours, safaris, and river
  cruises from over 2,500 vetted operators worldwide. Headquartered in Vienna, Austria,
  the company also operates a B2B Distribution API that lets OTAs, airlines, GDSs,
  and travel agencies search tour content and book departures through a unified API,
  alongside embeddable booking widgets and an affiliate program (RISE) for creators
  and publishers.

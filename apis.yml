apis:
- aid: tourradar:distribution-api
  name: TourRadar Distribution API
  description: >-
    Unified B2B API giving platforms, travel agencies, airlines, and GDSs access
    to TourRadar's network of 2,500+ organized adventure operators and 50,000+
    experiences. Offered in three tiers - a Search & Content API for affiliates,
    a wholesale Booking API that keeps bookings on the partner platform, and a
    Booking API Direct that uses the partner's own commercial agreements with
    TourRadar handling backend transactions. Prices, dates, and content are
    validated daily. Partners authenticate with OAuth 2.0 (AWS Cognito) and
    manage credentials through the partner dashboard, where the API
    documentation and an OpenAPI definition are available after login.
  humanURL: https://www.tourradar.com/distribution-api

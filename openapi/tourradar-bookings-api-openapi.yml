        status:
          type: string
          description: Status of the booking.
          enum:
          - open_question
          - open_hold
          - pending
          - confirmed
          - declined
          - cancelled
          - hold_expired
          - hold_declined
          example: confirmed
        currency:
          type: string
          description: Currency used for payments.
          example: USD
        total_value:
          type: number
          description: Total amount of the booking.

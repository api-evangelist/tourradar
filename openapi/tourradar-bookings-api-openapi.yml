  /v1/bookings/{bookingId}/status:
    get:
      tags:
      - Bookings
      summary: /v1/bookings/{bookingId}/status
      description: 'Retrieves the status of a booking created in the TourRadar system.


        To get the full details about a booking, use the **/bookings/{bookingId}** endpoint.


        The primary scope of this endpoint is to check the status of a `pending` booking, to verify if it has been confirmed by the operator.'
      parameters:
      - name: bookingId
        in: path
        description: Booking ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingStatus'
        '401':
          description: 'This status code indicates that the credentials used for the request are not valid.


            The error code is `UNAUTHORIZED`. An additional message may provide more information about the error.


            Causes for this error may be:


            - invalid authorization token

            - operation not allowed by authorization scope

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultError401'
        '500':
          description: 'This status code indicates that there was an unmanaged error.


            The error code is `UNKNOWN_ERROR`. An additional message may provide more information about the error.


            Causes for this error may be:


            - failure on the TourRadar system

            - unexpected conditions

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultError500'
      security:
      - application:
        - com.tourradar.bookings/read
      operationId: getV1BookingsByBookingIdStatus
      x-operation-id-source: derived
    servers:
    - url: https://api.sandbox.b2b.tourradar.com
components:
  schemas:
    Booking:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the booking in the TourRadar system.
          example: 892000
        tour_id:
          type: integer
          description: Deprecated. Moved to `$.tour.tour_id`.
          example: 14263
        tour:
          type: object
          description: Information about the tour that was booked.
          properties:
            tour_id:
              type: integer
              description: Unique identifier for the tour in the TourRadar system.
              example: 14263
            tour_name:
              type: string
              description: Name of the tour.
              example: Europe Escape - 12 Days

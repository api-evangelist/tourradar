                example: '3121'
    BookingInput:
      type: object
      properties:
        tour_id:
          type: integer
          description: Unique identifier for the tour in the TourRadar system.
          example: 5113
        departure_id:
          type: integer
          description: Unique identifier of the departure date. For a list of departure dates, use the **[/tours/{tourId}/departures](#tag/Pricing-and-Availability/paths/~1v1~1tours~1{tourId}~1departures/get)** endpoint.`
          example: 736283495
        currency:
          description: Currency code for the booking. The default is `USD`.
          enum:
          - USD
          - AUD
          - GBP
          - NZD
          - EUR
          - CAD
          example: EUR
        email:
          description: Email address for the lead passenger.
          type: string
          example: jane.doe@tourradar.com
        user_country:
          description: Identifier for the country of residence of the main passenger. Country IDs can be obtained from the **[/taxonomy/destinations/country](#tag/Taxonomy/paths/~1v1~1taxonomy~1destinations~1{type}/get)** endpoint.
          type: integer
          example: 139
        passengers:
          type: array
          description: List of passengers. Each entry represents one passenger.
          items:
            type: object
            properties:
              pax_number:
                type: integer
                description: Passenger identifier, starting from 1. If the booking contains 5 passengers, the values must be from 1 to 5.
              price_category_id:
                type: integer
                description: Price category ID retrieved from the **[/tours/{tourId}/prices](#tag/Pricing-and-Availability/paths/~1v1~1tours~1{tourId}~1prices/get)** endpoint.
              fields:
                type: object
                description: A set of key-value pairs containing passenger information. For a list of the available and mandatory keys, use the **[/operators/{operatorId}/booking-fields](#tag/Operators/paths/~1v1~1operators~1{operator}~1booking-fields/get)** endpoint.
            example:
            - pax_number: 1
              price_category_id: 1634
              fields:
                title: Mr.
                first_name: John
                last_name: Doe
                email: john.doe@tourradar.com
                phone_number: +46 029 01920 028
                date_of_birth: 11/06/1993
                gender: male
                address: Kartner Ring 5-7 Top 304-306
                city: Vienna
                postal_code: '1010'
                state: Vienna
                country: Austria
                nationality: Austria
                pre_existing_medical_conditions: none
            - pax_number: 2
              price_category_id: 1634
              fields:
                title: Ms.
                first_name: Jane
                last_name: Doe
                email: jane.doe@tourradar.com
                date_of_birth: 25/05/1994
                nationality: Austria
                gender: female
                pre_existing_medical_conditions: none
        accommodations:
          type: array
          description: Accommodation requested, and assignment to passengers.
          items:
            type: object
            properties:
              id:
                type: integer
                description: Unique identifier of the selected accommodation, taken from the **[/tours/{tourId}/departures/{departureId}](#tag/Pricing-and-Availability/paths/~1v1~1tours~1{tourId}~1departures~1{departureId}/get)** endpoint.
              passengers:
                type: array
                description: List of `pax_number` identifiers that should be placed in the selected accommodation.
                items:
                  type: integer
          example:
          - id: 396410
            passengers:
            - 1
            - 2
        optional_extras:
          type: array
          description: Optional extras requested, and assignment to passengers.
          items:
            type: object
            properties:
              id:
                type: integer
                description: Unique identifier of an optional extra, taken from the **[/tours/{tourId}/departures/{departureId}](#tag/Pricing-and-Availability/paths/~1v1~1tours~1{tourId}~1departures~1{departureId}/get)** endpoint.
              passengers:
                type: array
                description: List of `pax_number` identifiers for which this optional extra is being booked.
                items:
                  type: integer
          example:
          - id: 644520
            passengers:
            - 1
            - 2
        partner_booking_code:
          description: the booking code, or reference number, in your system. This will be stored with the booking, and returned with the booking detail request.
          type: string
          example: the_code_value
        custom_data:
          description: Additional info set by the partner when creating the booking. Up to 5 string properties can be set in it.
          type: object
          example:
            custom_attribute: custom value
            custom_date: Tuesday
        store_id:
          type:
          - string
          - 'null'
          description: 'Identifier of the store, or agency, that made the booking. Note: this is only relevant for bookings made via the TourRadar Partner API.'
          example: '878'
      required:
      - departure_id
      - email
      - passengers
      - user_country

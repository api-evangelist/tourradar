openapi: 3.2.0
info:
  title: Tourradar Bookings API
  version: '2025-08-11T15:08:05Z'
  x-logo:
    url: https://assets.api.sandbox.b2b.tourradar.com/logo/tourradar.svg
    altText: TourRadar Partner API
  description: 'Operations tagged Bookings across 2 of this provider''s published API definitions: tourradar-partner-api-openapi.json, tourradar-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sandbox.b2b.tourradar.com
tags:
- name: Bookings
  description: ''
paths:
  /v1/bookings:
    get:
      tags:
      - Bookings
      summary: /v1/bookings
      description: 'Returns a list of all the bookings created in the TourRadar system by your partner account.


        #### Response formats


        You can set the `Accept` header to define the response format you need.

        The available values are:

        - `application/json` (default). It will return an array of **BookingSearch** objects;


        - `text/csv`, if this format is requested the `limit` query parameter is ignored. It will contain these fields:


        | field | type | notes |

        | --------------- | ------- | ----- |

        | booking_id | integer | Unique identifier of the booking in the TourRadar system. |

        | tour_id | integer | Unique identifier for the tour in the TourRadar system. |

        | tour_name | string | Name of the tour. |

        | operator_id | integer | Unique identifier for the tour operator in the TourRadar system. |

        | operator_name | string | Name of the tour operator. |

        | tour_length_days | integer | Length of the tour, expressed in number of days. |

        | passengers | integer | Number of passengers. |

        | departure_date | string | Departure date that was booked, in the format `YYYY-MM-DD`. |

        | return_date | string | Return date that was booked, in the format `YYYY-MM-DD`. |

        | created_at | string | Exact timestamp of when the booking was created, in the ISO 8601 format. |

        | confirmed_at | string | Exact timestamp of when the booking was confirmed, in the ISO 8601 format. Empty if it is not confirmed. |

        | hold_expire_at | string | Exact timestamp of when the the hold will expire, in the ISO 8601 format. |

        | type | string | Type of this booking record. Expected values: `booking`, `question`, `hold`. |

        | status | string | Status of the booking. Expected values: `open_question`, `open_hold`, `pending`, `confirmed`, `declined`, `cancelled`, `hold_expired`, `hold_declined` |

        | currency | string | Currency of the booking. |

        | total_value | number | Total amount of the booking. |'
      parameters:
      - name: sort_by
        in: query
        description: 'Field by which the results will be sorted. Possible values: `id`, `departure_date`,  `created_at`, `status`. Default is `id`.'
        schema:
          type: string
      - name: Accept
        in: header
        description: Defines the response format. Current available values are `application/json` and `text/csv`.
        schema:
          type: string
      - name: updated_range
        in: query
        description: 'Get the bookings that are updated in a certain date range. Valid formats are: `YYYYMMDD-YYYYMMDD` and `YYYYMMDD`. Using the single date format, it will retrieve the bookings updated in that day.'
        schema:
          type: string
      - name: limit
        in: query
        description: Number of items per page of results (default is 20, max 100).
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: 'Defines in which language the resources are returned. Use ISO-639 language or locale codes (example: `en`, `en-US`).'
        schema:
          type: string
      - name: agent_id
        in: query
        description: Filter bookings by agent id.
        schema:
          type: string
      - name: page
        in: query
        description: Number of page to return (default is 1).
        schema:
          type: string
      - name: sort_order
        in: query
        description: 'Direction of the sorting (ascending or descending). Possible values: `asc`, `desc`.'
        schema:
          type: string
      - name: date_range
        in: query
        description: 'Date range in which to search for bookings. Valid formats are: `YYYYMMDD-YYYYMMDD` and `YYYYMMDD`. Using the single date format, it will retrieve the bookings created in that day.'
        schema:
          type: string
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingSearchPagination'
        '401':
          description: 'This status code indicates that the credentials used for the request are not valid.


            The error code is `UNAUTHORIZED`. An additional message may provide more information about the error.


            Causes for this error may be:


            - invalid authorization token

            - operation not allowed by authorization scope

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultError401'
        '500':
          description: 'This status code indicates that there was an unmanaged error.


            The error code is `UNKNOWN_ERROR`. An additional message may provide more information about the error.


            Causes for this error may be:


            - failure on the TourRadar system

            - unexpected conditions

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultError500'
      security:
      - application:
        - com.tourradar.bookings/read
      operationId: getV1Bookings
      x-operation-id-source: derived
    post:
      tags:
      - Bookings
      summary: /v1/bookings
      description: 'Creates a booking in the TourRadar system. The payload must be sent as JSON in the request body. The required entries are:


        * `departure_id`: this is the unique identifier of the wanted departure date for the desired tour. To retrieve departure dates, use the **/tours/{tourId}/departures** endpoint. * `currency`: the currency that will be used for payments. * `passengers`: the list of passengers in the booking. * `email`: email used for communications regarding the booking (partner support email). Please be aware that this email is different than the one from passengers definition. Furthermore, it''s possible to add the following sections, if needed:


        * `accommodations`: defines the desired accommodation types (if the tour offers them), and which passengers will use them. * `optional_extras`: optional extra items that can be booked together with the tour. This is an example of how the payload for a booking looks like:


        ```json

        {

        "departure_id": 123,

        "currency": "EUR",

        "email": "dummy@mail.org",

        "passengers": [

        {

        "pax_number": 1,

        "price_category_id": 1,

        "fields" : {

        "first_name": "John",

        "last_name": "Doe",

        "email": "dummy@mail.org",

        "phone_number": "+431245678853",

        "date_of_birth": "21/05/2019",

        "nationality": "Germany",

        "gender": "male"

        }

        },

        {

        "pax_number": 2,

        "price_category_id": 2,

        "fields" : {

        "first_name": "John",

        "last_name": "Doe",

        "email": "dummy@mail.org",

        "phone_number": "+431245678853",

        "date_of_birth": "21/05/2019",

        "nationality": "Germany",

        "gender": "female"

        }

        }

        ],

        "accommodations": [

        {

        "id": 345,

        "passengers": [1, 2]

        }

        ],

        "optional_extras": [

        {

        "id": 456,

        "passengers": [2]

        }

        ],

        }

        ```


        #### Passengers definition


        For each entry in the `passengers` array, these are the required fields:


        * `pax_number`: this is the index of the passenger, starting with 1. The passenger number will be used in the accommodation and extras sections of the request, to assign specific passengers to elements of the booking. * `price_category_id`: this defines the category of the passenger. To retrieve price categories, use the **/tours/{tourId}/prices** endpoint. * `fields`: this is the passenger information, as requested by the operator. To retrieve a list of fields, and if they are required or optional, use the **/operator/{operatorId}/booking-fields** endpoint. Some examples of these fields:

        * `title`: title of the passenger, possible values: `Mr.`, `Ms.`, `Mrs.`, `Miss`. * `gender`: gender of the passenger, possible values: `male`, `female`. * `date_of_birth`: date of birth of the passenger, format needed: `DD/MM/YYYY`. * `email`: the passenger''s email address. * `bed_preference`: the passenger''s bed preference, possible values: `Single Bed`, `Twin Bed`. * `nationality`: nationality of the passenger, please use country names from the taxonomy endpoint **/taxonomy/destinations/country**, some examples: `Argentina`, `Austria`, `Bahrain`, `Belgium`, `Australia`. #### Accommodation


        In the `accommodations` section, it''s possible to specify the identifier of an accommodation option, and which passenger numbers should make use of it. To retrieve a list of accommodation options available for the desired departure, use the **/tours/{tourId}/departures/{departureId}** endpoint. #### Optional extras


        The `optional_extras` section works exactly like the `accommodations` section. To retrieve a list of the optional extra items available for the desired departure, use the **/tours/{tourId}/departures/{departureId}** endpoint. #### Booking conversation page


        After the creation of the booking, you will receive in the response a link that leads to the booking conversation page. The link will be available in the `links` object in the response and it will have the type `booking-page`. This page is where all the communication happens between travelers and TourRadar, or the adventure operator. It shows details about the tour booked and has a price breakdown.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
        required: true
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          description: 'This status code indicates that the credentials used for the request are not valid.


            The error code is `UNAUTHORIZED`. An additional message may provide more information about the error.


            Causes for this error may be:


            - invalid authorization token

            - operation not allowed by authorization scope

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultError401'
        '500':
          description: 'This status code indicates that there was an unmanaged error.


            The error code is `UNKNOWN_ERROR`. An additional message may provide more information about the error.


            Causes for this error may be:


            - failure on the TourRadar system

            - unexpected conditions

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultError500'
      security:
      - application:
        - com.tourradar.bookings/write
      operationId: postV1Bookings
      x-operation-id-source: derived
    servers:
    - url: https://api.sandbox.b2b.tourradar.com

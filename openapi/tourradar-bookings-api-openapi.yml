        status_reason_context:
          type:
          - object
          - 'null'
          description: Additional information related to the current status, if set.
        accommodations:
          description: The accommodations related to the booking.
          type: array
          items:
            $ref: '#/components/schemas/BookingExtra'
        optional_extras:
          description: The optional extras related to the booking.
          type: array
          items:
            $ref: '#/components/schemas/BookingExtra'
        mandatory_addons:
          description: The mandatory addons related to the booking.
          type: array
          items:
            $ref: '#/components/schemas/BookingExtra'
        other_items:
          description: Related items with miscellaneous categories.

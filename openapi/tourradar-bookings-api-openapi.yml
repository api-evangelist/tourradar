          example: en_US
        last_message:
          type:
          - object
          - 'null'
          description: Information relative to the last message in this booking's conversation channel. Messages are not available for direct bookings.
          properties:
            author:
              type: string
              description: Author type of the message. `system` is for automatically generated notification messages, the other types reflect the role of the user who posted the message.
              enum:
              - operator
              - agent
              - traveller
              - system
              example: operator
            created_at:
              type: string
              description: Exact timestamp of when the message was sent, in the ISO 8601 format.
              example: '2022-01-08T12:05:20.000Z'
        partner_info:
          type: object
          description: Information relative to the partner that made the booking.
          properties:
            id:
              type: string
              description: Unique identifier of the partner in the TourRadar system.
              example: '87894'
            agent_id:
              type:
              - string
              - 'null'
              description: 'Identifier of the agent (user) that made the booking. Note: this is only relevant for bookings made on the TourRadar website.'
              example: '569'
            store_id:
              type:
              - string
              - 'null'
              description: 'Identifier of the store, or agency, that made the booking. Note: this is only relevant for bookings made via the TourRadar Partner API.'
              example: '878'
            contract_type:
              type: string
              description: Contract type that was applied for this booking.
              enum:
              - wholesale
              - organiser
              - affiliate
              - direct
              - shop
              example: wholesale
            calculation_base:
              type: string
              enum:
              - accommodation
              - all_extras
              description: Definition of the amount used as reference for the commission calculation.
              example: accommodation
            commission_rate:
              type: number
              description: The commission rate, expressed as multiplier. For example, a commission of 5% would be represented by `0.05`. If no commission will be paid for booking this tour, this will be `0`.
              example: 0
            commission_value:
              type: number
              description: The actual commission value, calculated on the price reported in this section.
              example: 0
            commission_status:
              type:
              - string
              - 'null'
              description: Commission withdrawal status.
              enum:
              - paid_out
              - earned
              - cancelled
              - pending
              example: paid_out
            booking_fee_rate:
              type: number
              description: The booking fee rate, if any, expressed as multiplier. For example, a booking fee of 5% would be represented by `0.05`. If no booking fee will be due for booking this tour, this will be `0`.
              example: 0
            booking_fee_value:
              type: number
              description: The actual booking fee value, calculated on the price reported in this section.
              example: 0
            booking_fee_status:
              type:
              - string
              - 'null'
              description: Booking fee payment status.
              enum:
              - paid
              - requested
              - cancelled
              - pending

  /v1/bookings/operator/{operator}/{bookingCode}:
    get:
      tags:
      - Bookings
      summary: /v1/bookings/operator/{operator}/{bookingCode}
      description: 'This endpoint returns detailed information about a booking, retrieved directly from the operator system. The call expects two parameters as part of the request path:


        - the operator ID

        - the booking code (in the operator system)


        Additionally, the following query string parameters are supported:


        - `currency`: the currency in which the booking was made (use 3-letter ISO 4217 codes, for example `USD` for US Dollars)

        - `surname`: the last name of one passenger in the booking

        - `next_id`: if the booking has multiple tours, the index of the tour to retrieve


        The parameters `currency` and `surname` are required by some operators in order to successfully retrieve a booking. A full example of a call to this endpoint could be:


        ```

        GET /bookings/operator/406/IVSYDS-A339296?surname=Davis¤cy=USD

        ```


        Additional parameters may be added in a future revision, for example the identifier of the agent (store ID) who made the booking. #### Retrieving operator ID


        To retrieve the operator ID for a specific operator, it''s possible to use the call /operators, which will return a list of all available operators with ID, name, and code. #### Output definition


        The output format is JSON, and the data structure follows closely the OTA standard. In particular, the response is based on the OTA_TourActivityBookRS.ReservationDetails schema. Unlike OTA, identifiers use the `snake_case` (lowercase, underscore between words) notation, instead of `PascalCase` (first letter of each word capitalized). Furthermore, some fields have been added to the existing schema to support the variety of data returned by operators. It should be noted that not all operators return all information for bookings. Where possible, data have been structured to minimize the difference between different operators'' implementations. The list of fields provided by **all operators** is defined as follows:


        | object | field | notes |

        | ------ | ----- | ----- |

        | confirmation | id | |

        | confirmation | status | |

        | basic_info | name | Name of the tour/activity |

        | basic_info | tour_activity_id | Operator code of the tour/activity |

        | schedule | duration | |

        | schedule | start | |

        | schedule | end | |

        | participant_info.individual | given_name | |

        | participant_info.individual | surname | |

        | participant_info.individual | birth_date | |

        | pricing.summary | amount | |

        | commission_info | commission_payable_amount | |


        > ⚠ **WARNING**: the list is not final in this version


        #### Error codes


        Every failed request will result in a HTTP status code in the 400 or 500 range. The JSON element `error` in the response will identify the error condition. This is a list of the possible error codes returned by this API:


        | Error code | HTTP Status code | Meaning |

        | ------ | ----- | ----- |

        | `UNAUTHORIZED` | 401 | Invalid operator credentials |

        | `BOOKING_NOT_FOUND` | 404 | Booking not found |

        | `OPERATOR_NOT_FOUND` | 412 | Invalid operator ID |

        | `INVALID_REQUEST` | 405 | Operation not supported |

        | `VALIDATION_ERROR` | 422 | Parameter missing or invalid |

        | `UNKNOWN_ERROR` | 500 | Server failure or unexpected error condition |

        | `REQUEST_FAILED` | 502 | Operator server failure |


        #### Booking status


        The booking status (response field `booking.status`) from different operators is mapped to one of the following values:


        - `pending`: the booking has not been confirmed yet

        - `confirmed`: the booking has been confirmed

        - `declined`: the booking has been cancelled by the operator

        - `cancelled`: the booking has been cancelled by the customer or agent


        In the event of a status response not recognised by the system, this field will contain `unknown`. In this case, another response field `booking.operator_status` will contain the original status information provided by the operator. #### Bookings with multiple tours


        Some operators include several tours/activities inside the same booking.'
      parameters:
      - name: bookingCode
        in: path
        description: 'Operator''s unique booking code (note: special characters must be URL-encoded)'
        required: true
        schema:
          type: string
      - name: currency
        in: query
        schema:
          type: string
      - name: operator
        in: path
        description: Operator ID
        required: true
        schema:
          type: string
      - name: surname
        in: query
        schema:
          type: string
      - name: next_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '401':
          description: 'This status code indicates that the credentials used for the fetch request are not valid.


            The error code is `UNAUTHORIZED`. An additional message may provide more information about the error.


            Causes for this error may be:


            - invalid authorization token

            - wrong configuration

            - outdated operator credentials

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: The error code
                    enum:
                    - UNAUTHORIZED
                    - UNKNOWN_ERROR
                  message:
                    type: string
                    description: The error message, if available
                  context:
                    type: object
                    description: Additional data relative to the error condition
                  validation_errors:
                    type: array
                    description: In case of validation error, all the elements that didn't pass validation
                    items:
                      type: string
        '404':
          description: 'This status code indicates that the operator or booking was not found.


            The error code is `BOOKING_NOT_FOUND` or `OPERATOR_NOT_FOUND`. An additional message may provide more information about the error.


            Causes for this error may be:


            - the booking code is invalid

            - one of the required parameters (surname, currency, etc.) is wrong

            - the operator parameter is wrong

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: The error code
                    enum:
                    - OPERATOR_NOT_FOUND
                    - BOOKING_NOT_FOUND
                    - UNKNOWN_ERROR
                  message:
                    type: string
                    description: The error message, if available
                  context:
                    type: object
                    description: Additional data relative to the error condition
                  validation_errors:
                    type: array
                    description: In case of validation error, all the elements that didn't pass validation
                    items:
                      type: string
        '405':
          description: 'This status code indicates that the operation is not supported for the given operator.


            The error code is `INVALID_REQUEST`. An additional message may provide more information about the error.


            Causes for this error may be:


            - the operator doesn''t support booking creation

            - the operator id is not integer

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: The error code
                    enum:
                    - INVALID_REQUEST
                    - UNKNOWN_ERROR
                  message:
                    type: string
                    description: The error message, if available
                  context:
                    type: object
                    description: Additional data relative to the error condition
                  validation_errors:
                    type: array
                    description: In case of validation error, all the elements that didn't pass validation
                    items:
                      type: string
        '422':
          description: 'This status code indicates that there was a validation error in the request parameters.


            The error code is `VALIDATION_ERROR`. An additional `validation_errors` element will list all the parameters which were invalid.


            Causes for this error may be:


            - required parameters are missing

            - some parameters have the wrong type

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: The error code
                    enum:
                    - VALIDATION_ERROR
                    - UNKNOWN_ERROR
                  message:
                    type: string
                    description: The error message, if available
                  context:
                    type: object
                    description: Additional data relative to the error condition
                  validation_errors:
                    type: array
                    description: In case of validation error, all the elements that didn't pass validation
                    items:
                      type: string
        '500':
          description: 'This status code indicates that there was an unmanaged error.


            The error code is `UNKNOWN_ERROR`. An additional message may provide more information about the error.


            Causes for this error may be:


            - failure on the TourRadar system

            - unexpected conditions

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultError500'
        '502':
          description: 'This status code indicates that there was a failure on the operator''s system.


            The error code is `REQUEST_FAILED`. An additional message may provide more information about the error.


            Causes for this error may be:


            - network connectivity issue to the operator''s system

            - operator''s system failing

            - operator''s system responding with an invalid response'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: The error code
                    enum:
                    - REQUEST_FAILED
                    - OPERATOR_TIMEOUT
                    - UNKNOWN_ERROR
                  message:
                    type: string
                    description: The error message, if available
                  context:
                    type: object
                    description: Additional data relative to the error condition
                  validation_errors:
                    type: array
                    description: In case of validation error, all the elements that didn't pass validation
                    items:
                      type: string
      security:
      - application:
        - com.tourradar.bookings/read
      operationId: getV1BookingsOperatorByOperatorByBookingCode
      x-operation-id-source: derived
    servers:
    - url: https://api.sandbox.b2b.tourradar.com

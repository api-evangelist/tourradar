        reservation_details:
          type: object
          description: Detailed reservation information for one matching reservation.
          properties:
            confirmation:
              type: object
              properties:
                id:
                  type: string
                  description: A unique identifying value assigned by the creating system. The ID attribute may be used to reference a primary-key value within a database or in a particular implementation.
                  example: TTCXXX-X123456
                status:
                  type:
                  - 'null'
                  - string
